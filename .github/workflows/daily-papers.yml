name: Daily AI Papers Digest

on:
  schedule:
    # 每天 09:10 北京时间（UTC+8）触发 = 01:10 UTC
    - cron: '10 1 * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: '回溯窗口小时数（留空使用默认值，用于补种/手动测试）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fetch-and-summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch & summarize papers
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours }}
        run: python papers/scripts/fetch_papers.py

      - name: Commit & push if changed
        run: |
          git config user.name "papers-bot"
          git config user.email "papers-bot@users.noreply.github.com"
          git add papers/
          if git diff --cached --quiet; then
            echo "没有新论文，无需提交"
          else
            git commit -m "chore: daily AI papers digest $(date -u +%Y-%m-%d)"
            git push
          fi
